name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22.x

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run client lint
        run: npm run lint:client

      - name: Run typecheck
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Run automated tests
        run: npm test

      - name: Run OpenCode Go smoke test
        run: npm run smoke

      - name: Build TUI client
        run: npm run build:client

      - name: Test TUI client
        run: npm run test:client
