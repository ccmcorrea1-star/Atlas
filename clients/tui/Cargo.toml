[package]
name = "atlas-tui"
version = "0.1.0"
edition = "2024"
description = "Official terminal client for the Atlas Runtime"
license = "ISC"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync"] }
