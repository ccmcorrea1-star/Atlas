[package]
name = "atlas-tui"
version = "0.1.0"
edition = "2024"
description = "Atlas terminal client using the Codex TUI presentation model"
license = "Apache-2.0"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
derive_more = { version = "2", features = ["is_variant"] }
futures-core = "0.3"
pulldown-cmark = "0.12"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info", "unstable-widget-ref"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
textwrap = "0.16.2"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
tracing = "0.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
pretty_assertions = "1"
itertools = "0.14"
insta = "1.46"
