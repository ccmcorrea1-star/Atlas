<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Atlas — inteligência residente</title>
  <desc id="desc">Banner institucional do Atlas com planeta escuro, símbolo A e mensagem em português</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="0.62" stop-color="#0a0b0d"/>
      <stop offset="1" stop-color="#141619"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#34383d"/>
      <stop offset="0.5" stop-color="#181b1f"/>
      <stop offset="1" stop-color="#070809"/>
    </radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dbe0"/>
    </linearGradient>
    <clipPath id="planetClip">
      <circle cx="1165" cy="238" r="176"/>
    </clipPath>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>

  <circle cx="1165" cy="238" r="176" fill="url(#planet)" opacity=".95"/>
  <g clip-path="url(#planetClip)" opacity=".18" fill="none" stroke="#8f969e" stroke-width="2">
    <path d="M1015 178 C1068 143 1092 156 1138 133 C1183 111 1229 123 1273 154"/>
    <path d="M1030 250 C1086 220 1116 234 1156 211 C1203 184 1254 192 1302 221"/>
    <path d="M1053 318 C1104 288 1142 300 1186 280 C1230 260 1263 268 1294 285"/>
    <path d="M1123 73 C1098 128 1096 189 1103 250 C1110 311 1131 365 1162 407"/>
    <path d="M1206 69 C1186 127 1182 185 1188 243 C1195 304 1214 355 1241 393"/>
  </g>

  <g fill="none" stroke="#cbd1d7" opacity=".48">
    <ellipse cx="1165" cy="238" rx="250" ry="78" transform="rotate(-18 1165 238)" stroke-width="2"/>
    <circle cx="1365" cy="139" r="7" fill="#dfe3e7" stroke="none"/>
  </g>

  <g transform="translate(990 58)" opacity=".16">
    <path d="M175 0 L344 302 H278 L175 116 L72 302 H6 Z" fill="#ffffff"/>
  </g>

  <g transform="translate(110 92)">
