    <text x="190" y="108" fill="url(#white)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="92" font-weight="500" letter-spacing="24">ATLAS</text>

    <text x="190" y="190" fill="#c4c8cd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="400">Inteligência residente</text>
    <text x="190" y="235" fill="#c4c8cd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="400">para o seu ambiente digital.</text>

    <text x="190" y="312" fill="#858b92" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500" letter-spacing="5">MEMÓRIA  ·  DESCOBERTA  ·  FERRAMENTAS  ·  LOCAL-FIRST</text>
