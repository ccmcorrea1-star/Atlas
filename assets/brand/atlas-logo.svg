<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">Atlas</title>
  <desc id="desc">Logo Atlas retrofuturista minimalista com planeta orbital e efeito CRT sutil.</desc>

  <defs>
    <radialGradient id="planet" cx="33%" cy="28%" r="78%">
      <stop offset="0" stop-color="#F1EEE3"/>
      <stop offset=".28" stop-color="#B8D7D9"/>
      <stop offset=".58" stop-color="#4D8998"/>
      <stop offset=".82" stop-color="#18333E"/>
      <stop offset="1" stop-color="#0B1117"/>
    </radialGradient>

    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2=".15">
      <stop offset="0" stop-color="#78D9E6"/>
      <stop offset=".58" stop-color="#8BD6E3"/>
      <stop offset="1" stop-color="#728BD8"/>
    </linearGradient>

    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="wordGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".10"/>
    </pattern>

    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="screen"/>
    </filter>
  </defs>

  <rect width="1024" height="768" fill="#090C10"/>

  <!-- símbolo -->
  <g transform="translate(512 268)" filter="url(#softGlow)">
    <circle r="86" fill="url(#planet)"/>

    <!-- parte traseira da órbita -->
    <ellipse rx="145" ry="43" transform="rotate(-18)" fill="none"
      stroke="#15323C" stroke-width="7"/>

    <!-- máscara visual simples: planeta cobre o trecho traseiro -->
    <circle r="82" fill="url(#planet)"/>

    <!-- trecho frontal da órbita -->
    <path d="M-134 52 C-58 70 72 30 139 -30"
      fill="none" stroke="url(#orbit)" stroke-width="6" stroke-linecap="round"/>

    <circle cx="132" cy="-63" r="10" fill="#8CE6EA"/>
  </g>

  <!-- leve aberração cromática atrás do wordmark -->
  <text x="512" y="510" text-anchor="middle"
    font-family="Eurostile, Microgramma, 'Arial Black', sans-serif"
    font-size="118" font-weight="700" letter-spacing="10"
    fill="#5ECBD8" opacity=".20">ATLAS</text>

  <text x="514" y="510" text-anchor="middle"
    font-family="Eurostile, Microgramma, 'Arial Black', sans-serif"
    font-size="118" font-weight="700" letter-spacing="10"
    fill="#7775C9" opacity=".16">ATLAS</text>

  <text x="513" y="508" text-anchor="middle"
    font-family="Eurostile, Microgramma, 'Arial Black', sans-serif"
    font-size="118" font-weight="700" letter-spacing="10"
    fill="#F1EEE3" filter="url(#wordGlow)">ATLAS</text>

  <!-- tratamento VHS/CRT sutil; não altera a geometria da marca -->
  <rect width="1024" height="768" fill="url(#scanlines)" pointer-events="none"/>
  <rect width="1024" height="768" fill="transparent" filter="url(#grain)" pointer-events="none"/>
</svg>
